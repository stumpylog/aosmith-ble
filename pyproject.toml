[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "aosmith-ble"
version = "0.1.0"
description = "Local Bluetooth LE client for A.O. Smith iCOMM heat pump water heaters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "bleak>=0.21",
  "bleak-retry-connector>=3.4",
]
optional-dependencies.dev = [ "pytest>=8", "pytest-asyncio>=0.24" ]

[dependency-groups]
docs = [ "zensical" ]

[tool.hatch]
build.targets.wheel.packages = [ "src/aosmith_ble" ]

[tool.codespell]
ignore-words-list = "raed"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.asyncio_mode = "auto"
