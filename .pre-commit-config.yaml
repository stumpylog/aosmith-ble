# Run with prek (https://github.com/j178/prek): `prek install`, then `prek run --all-files`.
# prek reads this file and is compatible with the pre-commit config format.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: "^LICENSE$"
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        exclude: "^(uv.lock|tests/fixtures/.*)$"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.18.1
    hooks:
      - id: pyproject-fmt
  - repo: local
    hooks:
      - id: check-identifiers
        name: block real device identifiers
        entry: python scripts/check_identifiers.py
        language: system
        pass_filenames: true
        exclude: "^uv.lock$"
